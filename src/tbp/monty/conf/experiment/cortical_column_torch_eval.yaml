# YCB objects for training and evaluation
objects:
  - "025_mug"
  - "011_banana"
  - "013_apple"
  - "035_power_drill"
  - "003_cracker_box"

# Panda3DTorchExperiment constructor arguments
experiment:
  # First object's path — set at runtime via ycb_glb_path(objects[0])
  model_path: "__SET_AT_RUNTIME__"
  hierarchical: false
  resolution: [128, 128]
  fov: 90.0
  near: 0.01
  far: 10.0
  initial_distance: 0.3
  object_position: [0.0, 0.0, 0.0]
  object_scale: [1.0, 1.0, 1.0]
  rotation_degrees: 5.0
  translation_distance: 0.004

  # CorticalColumnTorch parameters
  column_kwargs:
    n_minicolumns: 2048
    n_cells_per_minicolumn: 8
    sparsity: 0.03
    seed: 42
    use_apical: false
    base_learning_rate: 0.01
    evidence_decay: 0.01

# Training parameters
train:
  n_steps: 50

# Evaluation parameters
eval:
  n_steps: 30

# Acceptance criteria
criteria:
  min_accuracy: 0.8         # >80% top-1 accuracy on 5 objects
  max_steps: 100            # Recognition within 100 steps
  novelty_surprise_min: 0.3 # Unseen objects must sustain surprise > 0.3
