defaults:
  - phase2_ycb_category_control_eval_holdout
  - config/environment_interface/clear_eval_env_interface_args@config
  - config/environment_interface/per_object@config.eval_env_interface_args
  - config/environment_interface/ycb/phase2_category_train_objects@config.eval_env_interface_args.object_names

_target_: tbp.monty.frameworks.experiments.sdr_fitting_experiments.MontyEvidenceSDRFittingExperiment

config:
  do_train: false
  do_eval: true
  model_name_or_path: ${path.expanduser:${oc.env:MONTY_LOGS}/projects/phase2_review_runs/phase2_ycb_category_control_train/pretrained/}
  n_eval_epochs: ${benchmarks.rotations_all_count}
  logging:
    output_dir: ${path.expanduser:${oc.env:MONTY_LOGS}/projects/phase2_review_runs}
    run_name: phase2_ycb_category_sdr_fit_eval_train_objects
  monty_config:
    learning_module_configs:
      learning_module_0:
        learning_module_class: ${monty.class:tbp.monty.frameworks.models.evidence_sdr_matching.EvidenceSDRGraphLM}
        learning_module_args:
          sdr_args:
            log_path: ${path.expanduser:${oc.env:MONTY_LOGS}/projects/phase2_review_runs/phase2_ycb_category_sdr_fit_eval_train_objects/sdr_logs}
            sdr_length: 2048
            sdr_on_bits: 41
            sdr_lr: 1e-2
            n_sdr_epochs: 1000
            stability: 0.0
            train_sdr_on_eval: true
            sdr_log_flag: false
  eval_env_interface_args:
    object_init_sampler:
      _target_: tbp.monty.frameworks.environments.object_init_samplers.Predefined
      rotations: ${benchmarks.rotations_all}