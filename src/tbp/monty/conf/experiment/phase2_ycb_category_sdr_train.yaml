defaults:
  - phase2_ycb_category_control_train
  - config/monty/learning_modules/clear_learning_module_configs@config.monty_config

config:
  logging:
    output_dir: ${path.expanduser:${oc.env:MONTY_LOGS}/projects/phase2_review_runs}
    run_name: phase2_ycb_category_sdr_train
  monty_config:
    learning_module_configs:
      learning_module_0:
        learning_module_class: ${monty.class:tbp.monty.frameworks.models.evidence_sdr_matching.EvidenceSDRGraphLM}
        learning_module_args:
          max_match_distance: 0.01
          tolerances:
            patch: {}
          feature_weights:
            patch: {}
          graph_delta_thresholds:
            patch:
              distance: 0.001
              pose_vectors: ${np.list_eval:[np.pi / 8, np.pi * 2, np.pi * 2]}
              principal_curvatures_log: [1, 1]
              hsv: [0.1, 1, 1]
          sdr_args:
            log_path: ${path.expanduser:${oc.env:MONTY_LOGS}/projects/phase2_review_runs/phase2_ycb_category_sdr_train/sdr_logs}
            sdr_length: 2048
            sdr_on_bits: 41
            sdr_lr: 1e-2
            n_sdr_epochs: 1000
            stability: 0.0
            sdr_log_flag: false
