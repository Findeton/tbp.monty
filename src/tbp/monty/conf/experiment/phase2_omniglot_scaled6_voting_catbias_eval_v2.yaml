defaults:
  - /experiment/config/defaults@config
  - /experiment/config/logging/defaults@config.logging
  - /experiment/config/monty/patch_and_view@config.monty_config
  - /experiment/config/monty/learning_modules/clear_learning_module_configs@config.monty_config
  - /experiment/config/monty/sensor_modules/clear_sensor_module_configs@config.monty_config
  - /experiment/config/environment/omniglot@config.env_interface_config
  - /experiment/config/environment_interface/omniglot/phase2_scaled_6chars_v2@config.eval_env_interface_args

_target_: tbp.monty.frameworks.experiments.object_recognition_experiments.MontyObjectRecognitionExperiment
config:
  model_name_or_path: ${path.expanduser:${oc.env:MONTY_LOGS}/projects/phase2_v2/omniglot_scaled6_voting/pretrained/}
  do_train: false
  n_eval_epochs: 1
  min_lms_match: 1
  logging:
    run_name: phase2_omniglot_scaled6_voting_catbias_eval_v2
  monty_config:
    monty_class: ${monty.class:tbp.monty.frameworks.models.evidence_matching.model.MontyForEvidenceGraphMatching}
    sm_to_lm_matrix:
      - [0]
      - [0]
    lm_to_lm_matrix: null
    lm_to_lm_vote_matrix:
      - [1]
      - [0]
    learning_module_configs:
      learning_module_0:
        learning_module_class: ${monty.class:tbp.monty.frameworks.models.evidence_matching.learning_module.EvidenceGraphLM}
        learning_module_args:
          max_match_distance: 5
          tolerances:
            patch:
              principal_curvatures_log: ${np.ones:2}
              pose_vectors: ${np.array:[45, 45, 45]}
          feature_weights:
            patch:
              pose_vectors: [0, 1, 0]
          hypotheses_updater_args:
            initial_possible_poses: [[0, 0, 0]]
          category_bias_strength: 0.5
          category_taxonomy:
            Alphabet_of_the_Magi_1: Alphabet_of_the_Magi
            Alphabet_of_the_Magi_2: Alphabet_of_the_Magi
            Alphabet_of_the_Magi_3: Alphabet_of_the_Magi
            Alphabet_of_the_Magi_4: Alphabet_of_the_Magi
            Alphabet_of_the_Magi_5: Alphabet_of_the_Magi
            Alphabet_of_the_Magi_6: Alphabet_of_the_Magi
            Anglo-Saxon_Futhorc_1: Anglo-Saxon_Futhorc
            Anglo-Saxon_Futhorc_2: Anglo-Saxon_Futhorc
            Anglo-Saxon_Futhorc_3: Anglo-Saxon_Futhorc
            Anglo-Saxon_Futhorc_4: Anglo-Saxon_Futhorc
            Anglo-Saxon_Futhorc_5: Anglo-Saxon_Futhorc
            Anglo-Saxon_Futhorc_6: Anglo-Saxon_Futhorc
            Arcadian_1: Arcadian
            Arcadian_2: Arcadian
            Arcadian_3: Arcadian
            Arcadian_4: Arcadian
            Arcadian_5: Arcadian
            Arcadian_6: Arcadian
            Armenian_1: Armenian
            Armenian_2: Armenian
            Armenian_3: Armenian
            Armenian_4: Armenian
            Armenian_5: Armenian
            Armenian_6: Armenian
            Asomtavruli_(Georgian)_1: Asomtavruli_(Georgian)
            Asomtavruli_(Georgian)_2: Asomtavruli_(Georgian)
            Asomtavruli_(Georgian)_3: Asomtavruli_(Georgian)
            Asomtavruli_(Georgian)_4: Asomtavruli_(Georgian)
            Asomtavruli_(Georgian)_5: Asomtavruli_(Georgian)
            Asomtavruli_(Georgian)_6: Asomtavruli_(Georgian)
      learning_module_1:
        learning_module_class: ${monty.class:tbp.monty.frameworks.models.evidence_matching.learning_module.EvidenceGraphLM}
        learning_module_args:
          max_match_distance: 5
          tolerances:
            patch:
              principal_curvatures_log: ${np.ones:2}
              pose_vectors: ${np.array:[45, 45, 45]}
          feature_weights:
            patch:
              pose_vectors: [0, 1, 0]
          hypotheses_updater_args:
            initial_possible_poses: [[0, 0, 0]]
          category_bias_strength: 0.5
          category_taxonomy:
            Alphabet_of_the_Magi_1: Alphabet_of_the_Magi
            Alphabet_of_the_Magi_2: Alphabet_of_the_Magi
            Alphabet_of_the_Magi_3: Alphabet_of_the_Magi
            Alphabet_of_the_Magi_4: Alphabet_of_the_Magi
            Alphabet_of_the_Magi_5: Alphabet_of_the_Magi
            Alphabet_of_the_Magi_6: Alphabet_of_the_Magi
            Anglo-Saxon_Futhorc_1: Anglo-Saxon_Futhorc
            Anglo-Saxon_Futhorc_2: Anglo-Saxon_Futhorc
            Anglo-Saxon_Futhorc_3: Anglo-Saxon_Futhorc
            Anglo-Saxon_Futhorc_4: Anglo-Saxon_Futhorc
            Anglo-Saxon_Futhorc_5: Anglo-Saxon_Futhorc
            Anglo-Saxon_Futhorc_6: Anglo-Saxon_Futhorc
            Arcadian_1: Arcadian
            Arcadian_2: Arcadian
            Arcadian_3: Arcadian
            Arcadian_4: Arcadian
            Arcadian_5: Arcadian
            Arcadian_6: Arcadian
            Armenian_1: Armenian
            Armenian_2: Armenian
            Armenian_3: Armenian
            Armenian_4: Armenian
            Armenian_5: Armenian
            Armenian_6: Armenian
            Asomtavruli_(Georgian)_1: Asomtavruli_(Georgian)
            Asomtavruli_(Georgian)_2: Asomtavruli_(Georgian)
            Asomtavruli_(Georgian)_3: Asomtavruli_(Georgian)
            Asomtavruli_(Georgian)_4: Asomtavruli_(Georgian)
            Asomtavruli_(Georgian)_5: Asomtavruli_(Georgian)
            Asomtavruli_(Georgian)_6: Asomtavruli_(Georgian)
    sensor_module_configs:
      sensor_module_0:
        sensor_module_class: ${monty.class:tbp.monty.frameworks.models.sensor_modules.CameraSM}
        sensor_module_args:
          sensor_module_id: patch
          features:
            - pose_vectors
            - pose_fully_defined
            - on_object
            - principal_curvatures_log
          save_raw_obs: false
          pc1_is_pc2_threshold: 1
      sensor_module_1:
        sensor_module_class: ${monty.class:tbp.monty.frameworks.models.sensor_modules.Probe}
        sensor_module_args:
          sensor_module_id: view_finder
          save_raw_obs: false
  eval_env_interface_class: ${monty.class:tbp.monty.frameworks.environments.embodied_data.OmniglotEnvironmentInterface}
