defaults:
  - base_config_10distinctobj_surf_agent
  - config/logging/clear_logging@config
  - config/logging/csv@config.logging
  - config/environment_interface/clear_eval_env_interface_args@config
  - config/environment_interface/per_object@config.eval_env_interface_args
  - config/environment_interface/ycb/phase2_category_holdout_objects@config.eval_env_interface_args.object_names

config:
  model_name_or_path: ${path.expanduser:${oc.env:MONTY_LOGS}/projects/phase2_v2/voting_checkpoint/pretrained/}
  n_eval_epochs: ${benchmarks.rotations_all_count}
  min_lms_match: 1
  logging:
    output_dir: ${path.expanduser:${oc.env:MONTY_LOGS}/projects/phase2_v2}
    run_name: phase2_v2_voting_eval_holdout
  eval_env_interface_args:
    object_init_sampler:
      _target_: tbp.monty.frameworks.environments.object_init_samplers.Predefined
      rotations: ${benchmarks.rotations_all}
  monty_config:
    sm_to_lm_matrix:
      - [0]
      - [0]
    lm_to_lm_matrix: null
    lm_to_lm_vote_matrix:
      - [1]
      - [0]
    learning_module_configs:
      learning_module_0:
        learning_module_class: ${monty.class:tbp.monty.frameworks.models.evidence_matching.learning_module.EvidenceGraphLM}
        learning_module_args:
          feature_weights:
            patch:
              hsv: ${np.array:[1, 0.5, 0.5]}
              pose_vectors: ${np.ones:3}
              principal_curvatures_log: ${np.ones:2}
          tolerances:
            patch:
              hsv: ${np.array:[0.1, 0.2, 0.2]}
              principal_curvatures_log: ${np.array:[1, 1]}
          max_match_distance: 0.01
          x_percent_threshold: 20
          evidence_threshold_config: all
          max_graph_size: 0.3
          num_model_voxels_per_dim: 100
          gsg:
            _target_: tbp.monty.frameworks.models.goal_state_generation.EvidenceGoalStateGenerator
            desired_object_distance: 0.025
          hypotheses_updater_class: ${monty.class:tbp.monty.frameworks.models.evidence_matching.burst_sampling.BurstSamplingHypothesesUpdater}
          hypotheses_updater_args:
            max_nneighbors: 5
      learning_module_1:
        learning_module_class: ${monty.class:tbp.monty.frameworks.models.evidence_matching.learning_module.EvidenceGraphLM}
        learning_module_args:
          feature_weights:
            patch:
              hsv: ${np.array:[1, 0.5, 0.5]}
              pose_vectors: ${np.ones:3}
              principal_curvatures_log: ${np.ones:2}
          tolerances:
            patch:
              hsv: ${np.array:[0.1, 0.2, 0.2]}
              principal_curvatures_log: ${np.array:[1, 1]}
          max_match_distance: 0.01
          x_percent_threshold: 20
          evidence_threshold_config: all
          max_graph_size: 0.3
          num_model_voxels_per_dim: 100
          gsg:
            _target_: tbp.monty.frameworks.models.goal_state_generation.EvidenceGoalStateGenerator
            desired_object_distance: 0.025
          hypotheses_updater_class: ${monty.class:tbp.monty.frameworks.models.evidence_matching.burst_sampling.BurstSamplingHypothesesUpdater}
          hypotheses_updater_args:
            max_nneighbors: 5
