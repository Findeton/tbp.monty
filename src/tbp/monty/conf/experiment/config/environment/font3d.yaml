env_init_func: ${monty.class:tbp.monty.frameworks.environments.font3d_data.Font3DEnvironment}
env_init_args:
  characters: ["A", "B", "C", "D", "E", "F", "G", "H", "K", "R"]
  image_size: 105
  font_size: 72
  patch_size: 10
  extrusion_scale: 0.3
  smooth_sigma: 1.0
  scan_step: 3
transform:
  - _target_: tbp.monty.frameworks.environment_utils.transforms.DepthTo3DLocations
    agent_id: ${monty.agent_id:agent_id_0}
    sensor_ids: ["patch"]
    resolutions: ${np.array:[[10, 10]]}
    world_coord: true
    zooms: 1
    get_all_points: true
    use_semantic_sensor: false
    depth_clip_sensors: [0]
    clip_value: 1.1
